simulation:
  num_learners: 900
  events_per_learner: 70
  split_ratio: [0.70, 0.15, 0.15] # train, val, test (learner-disjoint)
  seeds: [42, 123, 999]
  mastery_min: 0.05
  mastery_max: 0.95
  default_reliability_convention: 1.0
  missing_modality_default_uncertainty: 0.25

skills:
  - id: "fine_motor"
    name: "Fine Motor Control & Precision"
  - id: "visual_discrimination"
    name: "Visual Discrimination & Scanning"
  - id: "phonological_awareness"
    name: "Phonological & Vocalization Awareness"
  - id: "working_memory"
    name: "Visuospatial & Auditory Working Memory"
  - id: "categorization"
    name: "Semantic Association & Sorting"
  - id: "sequential_reasoning"
    name: "Pattern & Sequence Reasoning"

games:
  trace_glow:
    name: "Trace Glow"
    primary_skill: "fine_motor"
    secondary_skill: "visual_discrimination"
    active_modalities: ["motor", "attention"]
    guess_floor: 0.05
    lapse_ceiling: 0.08
    discrimination: 3.5
    difficulty_offset: -0.2
    difficulty_scale: 1.4

  bubble_pop_brigade:
    name: "Bubble Pop Brigade"
    primary_skill: "fine_motor"
    secondary_skill: "visual_discrimination"
    active_modalities: ["motor", "attention"]
    guess_floor: 0.10
    lapse_ceiling: 0.05
    discrimination: 3.0
    difficulty_offset: -0.1
    difficulty_scale: 1.2

  block_stacker:
    name: "Block Stacker"
    primary_skill: "fine_motor"
    secondary_skill: "sequential_reasoning"
    active_modalities: ["motor", "attention"]
    guess_floor: 0.05
    lapse_ceiling: 0.07
    discrimination: 3.2
    difficulty_offset: -0.15
    difficulty_scale: 1.3

  echo_safari:
    name: "Echo Safari"
    primary_skill: "phonological_awareness"
    secondary_skill: "working_memory"
    # Echo Safari accepts detected vocalization, not strict exact speech recognition
    active_modalities: ["vocalization", "attention"]
    guess_floor: 0.15
    lapse_ceiling: 0.10
    discrimination: 2.8
    difficulty_offset: -0.2
    difficulty_scale: 1.2

  picture_sentence_strips:
    name: "Picture Sentence Strips"
    primary_skill: "sequential_reasoning"
    secondary_skill: "categorization"
    active_modalities: ["visual_touch", "attention"]
    guess_floor: 0.10
    lapse_ceiling: 0.06
    discrimination: 3.4
    difficulty_offset: -0.1
    difficulty_scale: 1.3

  audio_search:
    name: "Audio Search"
    primary_skill: "working_memory"
    secondary_skill: "phonological_awareness"
    active_modalities: ["visual_touch", "attention"]
    guess_floor: 0.12
    lapse_ceiling: 0.08
    discrimination: 3.0
    difficulty_offset: -0.15
    difficulty_scale: 1.25

  category_sorting:
    name: "Category Sorting"
    primary_skill: "categorization"
    secondary_skill: "visual_discrimination"
    active_modalities: ["visual_touch", "attention"]
    guess_floor: 0.15
    lapse_ceiling: 0.05
    discrimination: 3.2
    difficulty_offset: -0.1
    difficulty_scale: 1.3

  visual_flip_match:
    name: "Visual Flip Match"
    primary_skill: "working_memory"
    secondary_skill: "visual_discrimination"
    active_modalities: ["visual_touch", "attention"]
    guess_floor: 0.08
    lapse_ceiling: 0.07
    discrimination: 3.6
    difficulty_offset: -0.2
    difficulty_scale: 1.4

  pattern_train:
    name: "Pattern Train"
    primary_skill: "sequential_reasoning"
    secondary_skill: "visual_discrimination"
    active_modalities: ["visual_touch", "attention"]
    guess_floor: 0.10
    lapse_ceiling: 0.06
    discrimination: 3.3
    difficulty_offset: -0.15
    difficulty_scale: 1.35

modalities:
  motor:
    description: "Motor tremor, screen touch jitter, or coordinate slippage"
    base_corruption_rate: 0.08
    estimation_noise_std: 0.05
    sensor_dropout_rate: 0.05
  vocalization:
    description: "Ambient acoustic noise, mic gating, vocalization detection noise"
    base_corruption_rate: 0.10
    estimation_noise_std: 0.06
    sensor_dropout_rate: 0.08
  visual_touch:
    description: "Multi-touch misfires, off-target tap drift"
    base_corruption_rate: 0.05
    estimation_noise_std: 0.04
    sensor_dropout_rate: 0.03
  attention:
    description: "Gaze wandering or sudden distraction during trial"
    base_corruption_rate: 0.07
    estimation_noise_std: 0.05
    sensor_dropout_rate: 0.05

models:
  dkt:
    hidden_dim: 48
    embedding_dim: 24
    learning_rate: 0.003
    batch_size: 64
    max_epochs: 35
    patience: 6
    weight_decay: 0.0001
  logistic:
    C: 1.0
    max_iter: 1000
    solver: "lbfgs"

controllers:
  fixed_difficulty:
    difficulty: 0.50
    cooldown_gap_hours: 2.0
    max_consecutive_failures: 3
    max_session_trials: 15
  streak_adaptive:
    initial_difficulty: 0.45
    up_step: 0.06
    down_step: 0.08
    cooldown_gap_hours: 2.0
    max_consecutive_failures: 3
    max_session_trials: 15
  target_adaptive:
    target_success_prob: 0.75
    initial_difficulty: 0.45
    gamma: 2.4
    nu_D: 1.0
    deadband: 0.04
    max_step_change: 0.08
    min_difficulty: 0.08
    max_difficulty: 0.95
    cooldown_gap_hours: 2.0
    max_consecutive_failures: 3
    max_session_trials: 15
